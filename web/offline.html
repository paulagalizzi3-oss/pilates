<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0F12">
<title>Sin conexión · Control de Turnos</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D0F12;color:#E8EAED;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:0;font-size:24px}
  p{margin:0;color:#A8ADB5;line-height:1.5}
  button{margin-top:8px;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:#C8E62D;color:#0D0F12;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/web/images/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>Para ver los turnos y reservar clases necesitás internet. Revisá tu conexión y probá de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
